# =============================================================================
# iHIM - Continuous Integration Pipeline
# =============================================================================
# Triggers:
#   - Push to main branch
#   - Pull requests to main branch
#
# Jobs:
#   - lint: Code style and type checking
#   - test: Run pytest
#   - build: Build and test Docker image
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'IHIM/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'IHIM/**'

defaults:
  run:
    working-directory: IHIM

jobs:
  # ---------------------------------------------------------------------------
  # Lint: Code quality checks
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: IHIM/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true

      - name: Run ruff (linting)
        run: |
          pip install ruff
          ruff check . --output-format=github || true

      - name: Run ruff (formatting check)
        run: |
          ruff format --check . || true

  # ---------------------------------------------------------------------------
  # Test: Run pytest
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: IHIM/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests
        run: |
          pytest --tb=short -v || echo "No tests found or tests failed"

  # ---------------------------------------------------------------------------
  # Build: Docker image build and test
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: IHIM
          file: IHIM/Dockerfile
          push: false
          load: true
          tags: ihim:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          # Start container
          docker run -d --name ihim-test -p 7777:7777 ihim:test

          # Wait for startup
          sleep 5

          # Health check
          curl --fail http://localhost:7777/api/health || exit 1

          # Cleanup
          docker stop ihim-test
          docker rm ihim-test

      - name: Output image size
        run: |
          docker images ihim:test --format "{{.Size}}"
