# Second Brain Orchestrator Configuration

# Ollama settings
ollama:
  base_url: "http://localhost:11434"
  models:
    fast: "qwen2.5:7b-fast"      # Classification
    reason: "qwen2.5:14b-reason"  # Deep reasoning, chat

# Brain handler settings
brain:
  confidence_threshold: 0.7  # Below this -> Misc
  categories:
    - People
    - Projects
    - Ideas
    - Admin
    - Tasks
    - Misc

# Inbox watcher settings
watcher:
  poll_interval: 2.0  # Seconds between polls
  file_pattern: "*.md"

# Data paths (relative to IHIM root)
paths:
  data_root: "data/local/brain"
  inbox: "data/local/brain/inbox"
  processed: "data/local/brain/processed"
  misc: "data/local/brain/Misc"
  logs: "data/local/brain/logs"

# Routing
# All notes go through brain handler (classify → dedup → store → calendar push)
# Future: add chat handler for conversational queries

