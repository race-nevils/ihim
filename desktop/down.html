<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>iHIM — backend down</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #11111b; color: #cdd6f4; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .card { text-align: center; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #f38ba8;
         margin-right: 8px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  button { margin-top: 16px; padding: 8px 22px; border: 1px solid rgba(137, 180, 250, 0.5); border-radius: 6px;
           background: #1e1e2e; color: #cdd6f4; font: inherit; cursor: pointer; }
  button:hover { background: #313244; }
  .hint { color: #585b70; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <div><span class="dot"></span>Backend is not answering</div>
  <button id="restart">Restart Backend</button>
  <div class="hint">Reconnects automatically the moment it's back.</div>
</div>
<script>
  const base = new URLSearchParams(location.search).get('base') || 'http://127.0.0.1:7777';
  document.getElementById('restart').onclick = () => window.ihimShell.restartBackend();
  // Polling goes through the shell (file:// can't fetch the server directly);
  // the redirect itself is a top-level navigation.
  setInterval(async () => {
    try { if (await window.ihimShell.isBackendUp()) location.replace(base); } catch {}
  }, 2000);
</script>
</body>
</html>
