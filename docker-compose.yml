# =============================================================================
# iHIM - Docker Compose for Local Development
# =============================================================================
# Usage:
#   docker-compose up        # Start in foreground
#   docker-compose up -d     # Start in background
#   docker-compose down      # Stop and remove containers
#   docker-compose logs -f   # Follow logs
# =============================================================================

services:
  ihim:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ihim
    ports:
      - "${IHIM_PORT:-7777}:7777"
    environment:
      - IHIM_HOST=${IHIM_HOST:-0.0.0.0}
      - IHIM_PORT=${IHIM_PORT:-7777}
      - IHIM_LOG_LEVEL=${IHIM_LOG_LEVEL:-info}
    volumes:
      # Persist data directory
      - ihim-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7777/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Development mode with hot reload
  ihim-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ihim-dev
    ports:
      - "${IHIM_DEV_PORT:-7778}:7777"
    environment:
      - IHIM_HOST=0.0.0.0
      - IHIM_PORT=7777
      - IHIM_LOG_LEVEL=debug
      - IHIM_RELOAD=true
    volumes:
      # Mount source for hot reload
      - ./api:/app/api:ro
      - ./actions:/app/actions:ro
      - ./team:/app/team:ro
      - ./ui:/app/ui:ro
      - ihim-dev-data:/app/data
    command: ["sh", "-c", "uvicorn api.main:app --host 0.0.0.0 --port 7777 --reload --log-level debug"]
    profiles:
      - dev

volumes:
  ihim-data:
    name: ihim-data
  ihim-dev-data:
    name: ihim-dev-data
