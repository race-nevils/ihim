<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iHIM</title>
    <!-- Lucide Icons (self-hosted, pinned to v1.14.0) -->
    <script src="/static/js/vendor/lucide.min.js?v=__BOOT_ID__"></script>
    <link rel="stylesheet" href="/static/style.css?v=__BOOT_ID__">
</head>

<body>
    <a href="#actions-grid" class="skip-link">Skip to content</a>

    <!-- Desktop-shell title bar: visible ONLY inside the Electron app
         ([data-shell] on <html>, stamped below). Styled like the bottom
         status bar; the whole strip is the window drag region, with the
         native min/max/close overlaid top-right by the shell. -->
    <div class="top-bar" aria-hidden="true"></div>
    <script>
        // The shell's preload exposes ihimShell; a plain browser never has it.
        if (window.ihimShell) document.documentElement.setAttribute('data-shell', '1');
    </script>

    <!-- Background bake: replaces the engine-rasterized CSS gradients with a
         float-precision, dithered canvas render (identical pixels in browser
         and desktop shell). The CSS background stays as first-paint fallback. -->
    <script src="/static/js/bg-bake.js?v=__BOOT_ID__"></script>

    <!-- Bottom Status Bar — the arc-reactor system menu anchors the left end
         (start-menu style; screen-level actions like Restart Server) -->
    <nav id="bottom-bar" class="bottom-bar" aria-label="System Status">
        <ihim-arc-menu id="arc-menu"></ihim-arc-menu>
        <ihim-taskbar id="taskbar" class="taskbar"></ihim-taskbar>
        <div class="bar-spacer"></div>
        <ihim-system-monitor id="system-monitor" class="bar-widget"></ihim-system-monitor>
    </nav>

    <div class="container">
        <header>
            <h1>iHIM</h1>
            <p class="subtitle">Command Center</p>
        </header>

        <!-- Desktop tile grid (renders its own tiles) -->
        <ihim-desktop id="actions-grid" class="desktop-grid" role="main"></ihim-desktop>

        <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>

    <!-- Widget windows — each element IS its draggable panel (IhimPanel subclass) -->
    <ihim-todo id="todo-window" class="todo-window" persist-key="todoWindowPosition"
        taskbar-icon="list-todo" taskbar-label="To-Do"></ihim-todo>
    <ihim-stt id="stt-window" class="stt-window" persist-key="sttWindowPosition"
        taskbar-icon="mic" taskbar-label="STT"></ihim-stt>
    <ihim-recorder id="recorder-window" class="recorder-window" persist-key="recorderWindowPosition"
        taskbar-icon="mic" taskbar-label="Recorder"></ihim-recorder>
    <ihim-yt id="yt-window" class="yt-window" persist-key="ytWindowPosition"
        taskbar-icon="play" taskbar-label="YT Transcriber"></ihim-yt>
    <ihim-offline sync id="offline sync-window" class="offline sync-window" persist-key="sneakernetWindowPosition"
        taskbar-icon="hard-drive" taskbar-label="Sneakernet"></ihim-offline sync>

    <!-- Import Map — cache-busts ALL JS module imports with BOOT_ID -->
    __IMPORT_MAP__

    <!-- Application ES Modules -->
    <script type="module" src="/static/js/main.js?v=__BOOT_ID__"></script>

    <!-- Auto-reload on server restart OR static file change -->
    <script>
    (function() {
        var bootId = '__BOOT_ID__';
        var staticFp = null;          // learned from first poll
        var POLL_MS = 3000;           // check every 3 seconds
        var checking = false;
        var failCount = 0;            // consecutive poll failures

        // The dashboard must never silently freeze: when the server stops
        // answering (crash, sleep/wake death), say so on screen.
        function setServerDown(down) {
            var el = document.getElementById('server-down-banner');
            if (down && !el) {
                el = document.createElement('div');
                el.id = 'server-down-banner';
                el.textContent = 'iHIM server unreachable — data on screen is stale. Restart: scripts\\server.ps1 start';
                el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
                    'background:#b91c1c;color:#fff;font:600 13px system-ui,sans-serif;' +
                    'padding:8px 16px;text-align:center;';
                document.body.appendChild(el);
            } else if (!down && el) {
                el.remove();
            }
        }

        // On page load: detect if server restarted since last visit
        var stored = sessionStorage.getItem('ihim_boot_id');
        if (stored && stored !== bootId) {
            sessionStorage.setItem('ihim_boot_id', bootId);
            location.reload();
            return;
        }
        sessionStorage.setItem('ihim_boot_id', bootId);

        function checkForChanges() {
            if (checking) return;
            checking = true;
            fetch('/api/boot-id', { cache: 'no-store' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    checking = false;
                    failCount = 0;
                    setServerDown(false);
                    // Server restarted (new boot ID)
                    if (data.boot_id && data.boot_id !== bootId) {
                        sessionStorage.setItem('ihim_boot_id', data.boot_id);
                        location.reload();
                        return;
                    }
                    // Static files changed on disk (JS/CSS edited without server restart)
                    if (data.static_fp) {
                        if (staticFp === null) {
                            staticFp = data.static_fp; // learn baseline
                        } else if (data.static_fp !== staticFp) {
                            sessionStorage.setItem('ihim_boot_id', data.boot_id);
                            location.reload();
                            return;
                        }
                    }
                })
                .catch(function() {
                    checking = false;
                    failCount++;
                    if (failCount >= 2) setServerDown(true);
                });
        }

        // Continuous polling — catches changes while actively viewing the page
        setInterval(checkForChanges, POLL_MS);

        // Also check immediately on tab focus (faster than waiting for next interval)
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) checkForChanges();
        });
    })();
    </script>

    <!-- No service worker — the reload contract is the boot-id poll above.
         Deleting a worker's file does NOT clear registrations already
         installed in a profile (the last fetched worker stays active), so
         clear any left by the retired PWA lane, plus its shell cache. -->
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
            .then(function(regs) { regs.forEach(function(r) { r.unregister(); }); })
            .catch(function() {});
        if (window.caches) caches.delete('ihim-shell-v1').catch(function() {});
    }
    </script>

</body>

</html>
